<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城與城下町程度診斷</title>
<link rel="stylesheet" href="../../shared/style.css">
<script src="../../shared/skin.js"></script>
<script src="../../shared/quiz.js"></script>
</head>
<body>
<div class="sticky"><span>城與城下町程度診斷</span><span id="progress"></span></div>
<main>
<nav class="site-nav"><a href="../../index.html">日本學習</a> › <a href="../index.html">城與城下町</a></nav>
  <h1>城與城下町程度診斷</h1>
  <p class="lede">16 題，大約 10 分鐘，涵蓋全部七課。這不是考試，是讓老師知道哪幾課可以跳過、哪幾課要從頭講。</p>

  <div class="callout">
    <b>作答原則</b>：不確定就按「我不知道」，不要猜。猜對會讓老師以為你會了，結果跳過你真正需要的課。<br>
    作答會自動存在這個瀏覽器裡。交卷後按「複製結果」，貼到對話框給老師。<br>
    如果願意，也順便告訴老師：去過哪些城？接下來的旅行會經過哪些城市？這會決定導覽頁先做哪幾座。
  </div>

  <div id="results" class="results" hidden></div>
  <div id="quiz"></div>
  <p style="text-align:center;margin-top:36px"><button class="btn" id="submit">交卷</button></p>
  <p class="small" style="text-align:center">看不懂題目或想問任何問題，隨時直接問老師。</p>
</main>

<script>
const facets = [
  { id: 'l1', name: '第 1 課 選址與地形' },
  { id: 'l2', name: '第 2 課 繩張' },
  { id: 'l3', name: '第 3 課 石垣' },
  { id: 'l4', name: '第 4 課 天守' },
  { id: 'l5', name: '第 5 課 城的一生' },
  { id: 'l6', name: '第 6 課 城下町的設計' },
  { id: 'l7', name: '第 7 課 今天的城下町' },
];

const questions = [
  { id: 'l1-1', facet: 'l1', level: 1, type: 'choice',
    prompt: '日本的城常依地形分成三類。蓋在平原中央、四周沒有山可以靠的城叫什麼？',
    options: ['平城', '山城', '平山城', '水城'],
    explain: '平城（ひらじろ）蓋在平地上，防禦全靠人工挖的堀和堆的石垣。松本城、二條城都是平城。' },
  { id: 'l1-2', facet: 'l1', level: 2, type: 'choice',
    prompt: '戰國時代的城多半蓋在高山上，江戶時代的城多半移到平地附近的小丘或平原。主要原因是什麼？',
    options: ['城的任務從守住山頭變成管理城下的人和貨物', '山上的木材在戰國時代已經被砍光了', '江戶幕府規定城不能蓋得比一定高度還高', '平地的地基比山上更容易支撐大型天守'],
    explain: '打仗為主的年代，城要易守難攻；天下安定後，城主要統治領地、收稅、集中商人和武士，所以要靠近平原、河川和道路。' },

  { id: 'l2-1', facet: 'l2', level: 1, type: 'choice',
    prompt: '城被石垣或土壘、堀圍起來的一塊塊區域，例如「本丸」「二之丸」，總稱叫什麼？',
    options: ['曲輪', '虎口', '櫓', '狹間'],
    explain: '曲輪（くるわ）就是城裡的一塊區域。本丸是最核心的曲輪，外面一圈圈是二之丸、三之丸。' },
  { id: 'l2-2', facet: 'l2', level: 2, type: 'choice',
    prompt: '很多城門進去之後是一個四方形的小廣場，要轉 90 度才能穿過第二道門。這樣設計主要是為了什麼？',
    options: ['讓攻進來的敵人停下來、擠在裡面，從三面被攻擊', '讓大名的轎子有地方掉頭', '下雨時讓排隊的人有地方躲雨', '讓城門不會被強風直接吹開'],
    explain: '這叫枡形虎口（ますがたこぐち）。敵人衝過第一道門後被迫停下轉彎，四周的石垣和櫓可以同時射擊。' },

  { id: 'l3-1', facet: 'l3', level: 2, type: 'choice',
    prompt: '石垣的石頭切得方方正正、縫隙幾乎看不見。這種砌法通常是哪個時期的？',
    options: ['江戶時代初期以後（切込接）', '戰國時代中期（野面積）', '平安時代（土壘）', '明治時代以後的修補'],
    explain: '石頭加工程度越高，大致越晚。幾乎不加工的野面積較早，切成方塊、密接的切込接要到江戶初期以後才普遍。' },
  { id: 'l3-2', facet: 'l3', level: 3, type: 'choice',
    prompt: '石垣的轉角常把長方形的石頭「長邊、短邊交互」疊起來。這是為了什麼？',
    options: ['讓轉角咬合、承受兩面石垣往外推的力', '讓敵人比較難抓著石頭往上爬', '標示這段石垣是哪位大名負責的', '讓雨水沿著轉角流下不積在石縫'],
    explain: '這叫算木積（さんぎづみ）。轉角同時被兩面石垣推擠，長短交互讓石頭彼此咬住，高石垣才不容易崩。' },

  { id: 'l4-1', facet: 'l4', level: 1, type: 'choice',
    prompt: '江戶時代以前蓋好、一直保存到今天的「現存天守」，全日本有幾座？',
    options: ['12 座', '5 座', '約 50 座', '約 170 座'],
    explain: '現存天守 12 座，其中松本、犬山、彥根、姬路、松江 5 座是國寶。今天看到的其他天守，大多是戰後重建的。' },
  { id: 'l4-2', facet: 'l4', level: 2, type: 'choice',
    prompt: '大阪城的天守是 1931 年用鋼筋混凝土蓋的，外觀和豐臣或德川時代的天守都不完全一樣。這種天守一般叫什麼？',
    options: ['復興天守', '現存天守', '木造復元天守', '外觀復元天守'],
    explain: '原本有天守、但重建時沒有照原本的樣子蓋，叫復興天守。外觀照圖面或照片忠實重建的，叫外觀復元天守（例如名古屋城）。' },

  { id: 'l5-1', facet: 'l5', level: 2, type: 'choice',
    prompt: '1615 年江戶幕府規定每個大名的領國只能留一座城，其他都要拆掉。這道命令叫什麼？',
    options: ['一國一城令', '廢城令', '武家諸法度', '參勤交代'],
    explain: '一國一城令讓全國的城從數千座減到兩百座以下（常見的概算是約 3000 → 約 170）。這也是為什麼江戶時代留下的城幾乎都是大名的「主城」。' },
  { id: 'l5-2', facet: 'l5', level: 2, type: 'choice',
    prompt: '很多城今天只剩石垣和堀，木造的天守和櫓都不見了。下列哪一項<b>不是</b>主要原因？',
    options: ['江戶幕府下令把天守全部拆除', '明治初年的廢城令，城被賣掉或拆掉', '第二次世界大戰的空襲', '火災與雷擊'],
    explain: '幕府沒有下令拆天守。天守消失主要是火災雷擊（江戶時代就常見）、明治的廢城令和 1945 年的空襲。' },

  { id: 'l6-1', facet: 'l6', level: 1, type: 'choice',
    prompt: '城下町依身分分區。離城最近、圍繞在城外側的通常是哪一區？',
    options: ['武家地（武士的住宅）', '町人地（商人和工匠）', '寺町（寺院集中區）', '農村'],
    explain: '城的周圍是上級武士的宅地，身分越低住得越遠；商人工匠的町人地沿著主要街道；寺院常集中在城下町的外緣。' },
  { id: 'l6-2', facet: 'l6', level: 2, type: 'choice',
    prompt: '城下町的老街常出現丁字路和連續直角轉彎（鉤形彎道）。常見的解釋是什麼？',
    options: ['讓敵人看不遠、走不快，無法直衝到城門', '配合原本田埂的形狀，所以彎來彎去', '讓遊行的山車可以在轉角表演', '讓冬天的北風吹不進街道'],
    explain: '路一轉彎，從外面就看不到城，敵人的隊伍也得放慢、擠在轉角，守方可以在轉角埋伏。' },
  { id: 'l6-3', facet: 'l6', level: 2, type: 'choice',
    prompt: '很多城下町把寺院集中在城下町的外緣，形成「寺町」。下列哪一個理由比較說得通？',
    options: ['寺院有大片土地和圍牆，戰時可以當防線和駐兵處', '寺院的鐘聲要在城外才聽得到', '幕府規定寺院必須離城十里以上', '和尚不能和武士住在同一區'],
    explain: '寺院有圍牆、廣大的境內和堅固的建築，排在外緣就像一道防線；集中管理寺院也比較方便。' },

  { id: 'l7-1', facet: 'l7', level: 1, type: 'choice',
    prompt: '日本很多城市有「紺屋町」這個町名。它原本住的是什麼人？',
    options: ['染布的工匠', '打鐵的工匠', '賣米的商人', '下級武士'],
    explain: '紺屋（こんや／こうや）是染坊，因為最常染的是藍色（紺色）。打鐵的是鍛冶町，木匠是大工町。同業聚居是城下町的規劃。' },
  { id: 'l7-2', facet: 'l7', level: 2, type: 'choice',
    prompt: '今天很多縣廳、市役所、法院、公園蓋在原本的城跡或城旁邊。為什麼？',
    options: ['明治以後城跡是大片公有地，又在城市正中央', '日本法律規定政府機關一定要在城旁邊', '城的石垣可以防地震，所以政府機關蓋在上面', '戰後美軍規定城跡要改成辦公用地'],
    explain: '城和周圍的上級武家地是城下町正中央的大片土地，明治以後收歸公有，就順理成章變成官廳、軍隊、學校和公園。' },
  { id: 'l7-3', facet: 'l7', level: 2, type: 'choice',
    prompt: '在東京走「外堀通」這條大馬路時，路名透露了什麼？',
    options: ['這條路沿著江戶城外堀的位置，有些段落就是填平的堀', '這條路原本是護城河上方的高架橋', '路旁有很多賣堀川牛蒡的店', '這條路通往外地的堀姓大名領地'],
    explain: '江戶城的外堀很多段在明治以後被填平或沿岸修路，路名就留下了堀的位置。四谷到飯田橋一帶還看得到外堀的水面。' },
];

Quiz.mount(document.getElementById('quiz'), {
  title: '城與城下町程度診斷',
  storageKey: 'castles-diagnostic-v1',
  facets, questions,
  resultsEl: document.getElementById('results'),
  progressEl: document.getElementById('progress'),
  submitBtn: document.getElementById('submit'),
});
</script>
</body>
</html>
