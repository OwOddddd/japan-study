<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鐵道與交通程度診斷</title>
<link rel="stylesheet" href="../../shared/style.css">
<script src="../../shared/skin.js"></script>
<script src="../../shared/quiz.js"></script>
</head>
<body>
<div class="sticky"><span>鐵道與交通程度診斷</span><span id="progress"></span></div>
<main>
<nav class="site-nav"><a href="../../index.html">日本學習</a> › <a href="../index.html">鐵道與交通</a></nav>
  <h1>鐵道與交通程度診斷</h1>
  <p class="lede">8 個面向、16 題，每個面向對應一課。作答結果用來決定哪幾課可以跳過、哪幾課要從頭講。</p>

  <div class="callout">
    <b>作答原則</b>：不確定就按「我不知道」，不要猜。猜對會讓老師以為你會了，結果跳過你真正需要的課。<br>
    簡答題寫重點即可。作答會自動存在這個瀏覽器裡，中途關掉也不會不見。<br>
    交卷後按「複製結果，貼給老師」，把文字貼回對話框，老師會依結果調整課程。
  </div>

  <div id="results" class="results" hidden></div>
  <div id="quiz"></div>
  <p style="text-align:center;margin-top:36px"><button class="btn" id="submit">交卷</button></p>
  <p class="small" style="text-align:center">看不懂題目或想問任何問題，隨時直接問老師（在對話框問 Claude）。</p>
</main>

<script>
const facets = [
  { id: 'l1', name: '第 1 課・鐵道大國與三種業者' },
  { id: 'l2', name: '第 2 課・從國鐵到 JR' },
  { id: 'l3', name: '第 3 課・私鐵的經營模式' },
  { id: 'l4', name: '第 4 課・東京與大阪的路網' },
  { id: 'l5', name: '第 5 課・看懂車站' },
  { id: 'l6', name: '第 6 課・票價的結構' },
  { id: 'l7', name: '第 7 課・新幹線與城市' },
  { id: 'l8', name: '第 8 課・鐵道以外' },
];

const questions = [
  // ---------- 第 1 課 ----------
  { id: 'l1-1', facet: 'l1', level: 1, type: 'choice',
    prompt: '在東京搭電車，下列哪一組<b>都不是</b> JR 的路線或公司？',
    options: ['東京メトロ、小田急、京王', '山手線、中央線、京濱東北線', '總武線、埼京線、常磐線', '東海道線、橫須賀線、京葉線'],
    explain: '東京メトロ是地下鐵，小田急、京王是私鐵。其餘三組都是 JR 東日本的路線。' },
  { id: 'l1-2', facet: 'l1', level: 3, type: 'short',
    prompt: '日本的長距離幹線大多是 JR，私鐵大多只跑大都市和郊外之間。你認為這種分工是怎麼形成的？',
    keywords: [['國有', '国有', '收購', '買收', '買下', '國家'], ['幹線', '長距離', '主要'], ['明治', '1906', '政府'], ['郊外', '近郊', '都市', '通勤']],
    need: 2,
    answer: '1906 年的鐵道國有法讓國家買下私人經營的主要幹線，私鐵只剩下短程、地方性的路線，之後轉向大都市近郊的通勤線。' },

  // ---------- 第 2 課 ----------
  { id: 'l2-1', facet: 'l2', level: 1, type: 'choice',
    prompt: '1987 年國鐵分割民營化後，負責載客的 JR 公司有幾家？',
    options: ['6 家', '3 家', '8 家', '10 家'],
    explain: 'JR 北海道、東日本、東海、西日本、四國、九州，共 6 家；另外還有一家載貨的 JR 貨物。' },
  { id: 'l2-2', facet: 'l2', level: 2, type: 'choice',
    prompt: '下列哪一家 JR 負責東海道新幹線（東京～新大阪）？',
    options: ['JR 東海', 'JR 東日本', 'JR 西日本', '三家共同經營'],
    explain: '東海道新幹線整條歸 JR 東海，它的收入大部分來自這條線。東京站在 JR 東日本的地盤，但東海道新幹線的月台屬於 JR 東海。' },

  // ---------- 第 3 課 ----------
  { id: 'l3-1', facet: 'l3', level: 2, type: 'choice',
    prompt: '大阪梅田、東京澀谷等私鐵終點站上方常有同公司的百貨公司（阪急百貨店、東急百貨店）。最主要的原因是什麼？',
    options: ['每天經過的乘客就是現成的客人', '車站用地便宜，蓋百貨公司划算', '法律規定車站必須附設商業設施', '百貨公司出錢蓋了這些車站'],
    explain: '鐵道把沿線的人每天送到終點站，在終點站開店就能把這些乘客變成顧客，兩邊的生意互相拉抬。' },
  { id: 'l3-2', facet: 'l3', level: 3, type: 'short',
    prompt: '私鐵公司為什麼要在沿線自己開發住宅區、蓋遊樂園或劇場？',
    keywords: [['乘客', '搭車', '客人', '人潮', '搭乘'], ['住宅', '住', '通勤'], ['假日', '週末', '休閒', '反方向', '離峰', '空車'], ['土地', '地價', '賣地']],
    need: 2,
    answer: '住宅區製造每天通勤的乘客，遊樂園、劇場讓假日和反方向的列車也有人搭；沿線地價因鐵道上漲，賣地本身也賺錢。' },

  // ---------- 第 4 課 ----------
  { id: 'l4-1', facet: 'l4', level: 2, type: 'choice',
    prompt: '在東京，同一班電車從私鐵的線路開進地下鐵，再開到另一家私鐵的線路上。這叫什麼？',
    options: ['直通運轉', '轉乘接駁', '共同經營', '路線合併'],
    explain: '直通運轉（直通運転）：不同公司的線路互相接起來，列車直接開過去，乘客不用換車。' },
  { id: 'l4-2', facet: 'l4', level: 2, type: 'choice',
    prompt: '東京的地下鐵為什麼分成「東京メトロ」和「都營地下鐵」兩家？',
    options: ['兩個不同的機構分別建造，一直沒有合併', '一家負責東京市區，一家負責郊外', '一家只開白天，一家負責深夜班次', '外國企業投資了其中一家而分開'],
    explain: '東京メトロ的前身是 1941 年成立的「營團」，都營地下鐵由東京都交通局另外建造。兩邊各自擴建，至今沒有合併。' },

  // ---------- 第 5 課 ----------
  { id: 'l5-1', facet: 'l5', level: 1, type: 'choice',
    prompt: '同一條路線上，「各駅停車」、「快速」、「急行」、「特急」的主要差別是什麼？',
    options: ['停靠的車站多寡不同', '行駛的路線完全不同', '車廂的等級不一樣', '營運的公司不一樣'],
    explain: '這些叫「列車種別」，差在跳過多少站。各駅停車每站都停，越往特急越少停。有些特急另外要買特急券。' },
  { id: 'l5-2', facet: 'l5', level: 2, type: 'choice',
    prompt: '東京地下鐵站牌上的「G 09」代表什麼？',
    options: ['銀座線的第 9 個車站', '第 9 號出口在 G 區', '往 G 方向的第 9 月台', '距離起點 9 公里處'],
    explain: '這叫「車站編號」：英文字母是路線（G = 銀座線），數字是在這條線上的順序。' },

  // ---------- 第 6 課 ----------
  { id: 'l6-1', facet: 'l6', level: 2, type: 'choice',
    prompt: '搭 JR 特急列車時，車票通常要付哪兩部分？',
    options: ['運賃（車資）加上特急料金', '只要付一張特急車票的錢', '基本費加上每站停車費', '月台入場費加上車資'],
    explain: '日本的票價分兩層：「運賃」是移動的錢，「料金」是坐特急、指定席、綠色車廂等額外服務的錢。' },
  { id: 'l6-2', facet: 'l6', level: 3, type: 'short',
    prompt: '你打算買一張鐵道周遊券（例如 JR Pass 或地區周遊券）。要怎麼判斷它划不划算？',
    keywords: [['加總', '相加', '加起來', '總和', '合計', '單買', '單程', '個別'], ['比較', '比', '對照'], ['範圍', '路線', '適用', '能搭', '可搭'], ['天數', '期間', '日']],
    need: 2,
    answer: '把預計要搭的每一段單買票價加總，和周遊券的價格比較；同時確認周遊券的適用範圍（哪些公司、哪些列車能搭）與天數符合行程。' },

  // ---------- 第 7 課 ----------
  { id: 'l7-1', facet: 'l7', level: 1, type: 'choice',
    prompt: '日本第一條新幹線是哪一年、哪一段開通的？',
    options: ['1964 年，東京～新大阪', '1972 年，新大阪～岡山', '1982 年，大宮～盛岡', '1958 年，東京～名古屋'],
    explain: '1964 年 10 月 1 日，東海道新幹線開通，比東京奧運開幕早 9 天。' },
  { id: 'l7-2', facet: 'l7', level: 3, type: 'choice',
    prompt: '新幹線開通後，有些地方城市的商業和公司分店反而被大城市吸走。這種現象叫什麼？',
    options: ['吸管效應', '甜甜圈化', '過疏化', '都市更新'],
    explain: '吸管效應（ストロー効果）：交通變快以後，原本要在地方城市解決的事，可以當天往返大城市辦完，地方的分店、商圈被吸到大城市去。' },

  // ---------- 第 8 課 ----------
  { id: 'l8-1', facet: 'l8', level: 2, type: 'choice',
    prompt: '下列哪一座城市，至今仍以路面電車為主要的市內交通工具之一？',
    options: ['廣島', '橫濱', '名古屋', '仙台'],
    explain: '廣島電鉄是日本規模最大的路面電車之一。橫濱、名古屋、仙台的市電都在 1970 年代前後廢止了。' },
  { id: 'l8-2', facet: 'l8', level: 2, type: 'choice',
    prompt: '日本很多城市在 1960～70 年代把路面電車拆掉。主要的原因是什麼？',
    options: ['汽車變多，路面電車被當成妨礙交通', '路面電車的車廂老舊無法修理', '政府規定全部改建成地下鐵', '路面電車的票價太貴沒人搭'],
    explain: '汽車普及後，路面電車和汽車搶同一條路，常被塞住、也被嫌擋路，許多城市就改用公車和地下鐵。' },
];

Quiz.mount(document.getElementById('quiz'), {
  title: '鐵道與交通程度診斷',
  facets, questions,
  storageKey: 'jrail-diagnostic-v1',
  resultsEl: document.getElementById('results'),
  progressEl: document.getElementById('progress'),
  submitBtn: document.getElementById('submit'),
});
</script>
</body>
</html>
