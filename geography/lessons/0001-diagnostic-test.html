  <h1>日本地理程度診斷</h1>
  <p class="lede">12 個面向、52 題，每個面向由淺到深。這不是考試，是幫老師找出你該從哪裡開始學。</p>

  <div class="callout">
    <b>作答原則</b>：不確定就按「我不知道」，不要猜。猜對會讓老師以為你會了，結果跳過你真正需要學的部分。<br>
    簡答題寫重點即可，不用寫完整句子。作答會自動存在這個瀏覽器裡，中途關掉也不會不見。<br>
    交卷後按「複製結果，貼給老師」，把文字貼回對話框，老師會依結果安排課程。
  </div>

  <div id="quiz"></div>
