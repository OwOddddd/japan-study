  <h1>日文課程</h1>
  <p class="lede">目標：看懂日常題材的動畫、日劇和書籍，到了日本也看得懂、聽得懂身邊的日文。每課一個能帶到任何場景的文法點，單字從例句和短文裡慢慢累積，不背單字表。</p>

  <h2>課程</h2>
