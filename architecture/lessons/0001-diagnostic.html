<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建築程度診斷</title>
<link rel="stylesheet" href="../../shared/style.css">
<script src="../../shared/skin.js"></script>
<script src="../../shared/quiz.js"></script>
</head>
<body>
<div class="sticky"><span>建築程度診斷</span><span id="progress"></span></div>
<main>
<nav class="site-nav"><a href="../../index.html">日本學習</a> › <a href="../index.html">建築</a></nav>
  <h1>建築程度診斷</h1>
  <p class="lede">16 題，每兩題對應一課，大約 10 分鐘。這不是考試，是讓老師知道哪幾課可以跳過、哪幾課要從頭講。</p>

  <div class="callout">
    <b>作答原則</b>：不確定就按「我不知道」，不要猜。猜對會讓老師以為你會了，結果跳過你真正需要的課。<br>
    作答會自動存在這個瀏覽器裡。交卷後按「複製結果」，貼到對話框給老師。<br>
    如果願意，也順便告訴老師：去過哪些寺院、神社或老街？有沒有哪棟建築讓你看了想知道「為什麼長這樣」？
  </div>

  <div id="results" class="results" hidden></div>
  <div id="quiz"></div>
  <p style="text-align:center;margin-top:36px"><button class="btn" id="submit">交卷</button></p>
  <p class="small" style="text-align:center">看不懂題目或想問任何問題，隨時直接問老師。</p>
</main>

<script>
const facets = [
  { id: 'l1', name: '第 1 課 木造與氣候' },
  { id: 'l2', name: '第 2 課 寺院配置' },
  { id: 'l3', name: '第 3 課 寺院樣式' },
  { id: 'l4', name: '第 4 課 神社建築' },
  { id: 'l5', name: '第 5 課 住宅' },
  { id: 'l7', name: '第 7 課 宿場町與町家' },
  { id: 'l8', name: '第 8 課 庭園' },
  { id: 'l9', name: '第 9 課 洋風建築' },
];

const questions = [
  { id: 'l1-1', facet: 'l1', level: 1, type: 'choice',
    prompt: '日本的寺院和老房子，屋簷往外伸得很遠。主要是為了什麼？',
    options: ['擋雨，保護木頭牆壁和柱子', '讓屋頂看起來比較氣派', '冬天可以在簷下堆積柴火', '防止屋頂的雪滑下來傷人'],
    explain: '日本雨多，木頭一直淋濕會腐朽。屋簷伸得遠，雨就落在牆外。夏天也能擋掉高角度的陽光。' },
  { id: 'l1-2', facet: 'l1', level: 2, type: 'choice',
    prompt: '傳統木造建築的柱子，很多只是「放」在石頭上，沒有固定進地基。這樣做有什麼好處？',
    options: ['地震時建築可以整體滑動，不易折斷', '方便日後把整棟房子搬到別處', '可以省下挖地基的工錢與時間', '石頭可以把地底的熱傳進屋內'],
    explain: '柱子放在礎石上，大地震時建築可以在石頭上滑動，地面的力量不會全部傳上來。' },

  { id: 'l2-1', facet: 'l2', level: 2, type: 'choice',
    prompt: '從飛鳥時代到奈良時代，寺院裡的「塔」位置有什麼變化？',
    options: ['從中心慢慢移到旁邊，最後移出迴廊', '從旁邊慢慢移到中心，成為主角', '一直都在正中央，沒有變化', '奈良時代起寺院就不再建塔'],
    explain: '塔原本供奉佛舍利，是寺院中心。後來信仰重心轉到佛像，放佛像的金堂變成主角，塔就被移到旁邊，東大寺的塔甚至在迴廊外。' },
  { id: 'l2-2', facet: 'l2', level: 2, type: 'choice',
    prompt: '五重塔中央有一根從上貫穿到下的「心柱」。它在地震時的作用比較接近哪一種說法？',
    options: ['不承受屋頂重量，限制各層晃動的幅度', '承受整座塔的重量，把塔撐住不倒', '把各層牢牢釘死在一起，讓塔不會動', '心柱只是裝飾，與地震完全沒有關係'],
    explain: '塔的重量由四周的柱子承受；各層鬆鬆地疊起來，地震時往不同方向晃，中間的心柱擋住過大的晃動。東京晴空塔的制震設計也借用了「心柱」這個名稱。' },

  { id: 'l3-1', facet: 'l3', level: 2, type: 'choice',
    prompt: '屋簷下方，柱子頂端一層層木塊和橫木疊起來的構件叫什麼？',
    options: ['斗栱（組物）', '鴟尾', '千木', '破風'],
    explain: '斗栱（日文也叫組物）把屋簷的重量一層層傳到柱子上，屋簷才能伸得那麼遠。' },
  { id: 'l3-2', facet: 'l3', level: 3, type: 'choice',
    prompt: '下列哪一項是禪宗樣（禪寺的樣式）常見的特徵？',
    options: ['斗栱密密排滿柱與柱之間', '斗栱只放在柱子正上方', '牆面一律塗成朱紅色', '屋頂都是茅草鋪成的'],
    explain: '禪宗樣的斗栱除了柱頂，柱與柱之間也排滿（詰組），加上弧形頂部的花頭窗、放射狀的扇垂木。斗栱只在柱上的是和樣。' },

  { id: 'l4-1', facet: 'l4', level: 2, type: 'choice',
    prompt: '伊勢神宮每 20 年把社殿全部重建一次，這個儀式叫什麼？',
    options: ['式年遷宮', '解體修理', '御開帳', '大嘗祭'],
    explain: '式年遷宮：在旁邊的空地蓋一座一模一樣的新社殿，把神遷過去。最近一次是 2013 年，下一次是 2033 年。' },
  { id: 'l4-2', facet: 'l4', level: 3, type: 'choice',
    prompt: '全日本最常見的神社本殿形式是哪一種？特徵是正面的屋頂往前延伸，蓋住參拜的台階。',
    options: ['流造', '神明造', '大社造', '權現造'],
    explain: '流造的前側屋頂像水流一樣長長地延伸出去，蓋住台階，參拜者可以在屋簷下拜。' },

  { id: 'l5-1', facet: 'l5', level: 2, type: 'choice',
    prompt: '在平安貴族的住宅（寢殿造）裡，榻榻米是怎麼用的？',
    options: ['木地板上放幾張，坐或睡的地方才鋪', '整個房間從牆到牆鋪滿榻榻米', '平安時代還沒有榻榻米這種東西', '只鋪在走廊上，房間都是木地板'],
    explain: '平安時代的榻榻米像可以搬動的坐墊、床墊，放在木地板上需要的地方。鋪滿整個房間是室町時代以後的書院造。' },
  { id: 'l5-2', facet: 'l5', level: 3, type: 'choice',
    prompt: '和室裡掛掛軸、擺花的凹進去的空間叫「床之間」。它是從什麼演變來的？',
    options: ['室町時代展示畫軸和器物的設施', '平安貴族放床鋪的位置', '江戶時代商人放帳簿的櫃子', '鎌倉武士放刀和盔甲的架子'],
    explain: '室町時代的武家和禪僧流行從中國收藏畫軸與器物，在牆邊設置展示的台子（押板），後來固定成書院造的床之間。' },

  { id: 'l7-1', facet: 'l7', level: 2, type: 'choice',
    prompt: '京都的傳統町家，正面很窄、往裡面很深，被叫做「鰻魚的睡床」。下列哪一個是最站得住腳的原因？',
    options: ['大家都要面向大街做生意，臨街的寬度被切得很細', '京都規定房子不能比鄰居高，只好往後延伸', '為了讓冬天的冷風吹不進房子深處', '京都的地價越往裡面越便宜，所以往後蓋'],
    explain: '店面一定要臨街，街區又被切成細長條，每戶分到的臨街寬度就很窄。常聽到的「按臨街寬度課稅」是流傳很廣的說法，但根據不夠確實。' },
  { id: 'l7-2', facet: 'l7', level: 3, type: 'choice',
    prompt: '江戶時代的宿場町（街道上的驛站町），大名和幕府官員住的高級旅館叫什麼？',
    options: ['本陣', '旅籠', '番所', '長屋'],
    explain: '本陣是大名、公家住的指定旅館；一般旅客住旅籠。木曾路的妻籠宿、奈良井宿還留著當年的街道。' },

  { id: 'l8-1', facet: 'l8', level: 1, type: 'choice',
    prompt: '京都龍安寺那種只用石頭和白砂、沒有水的庭園，叫什麼？',
    options: ['枯山水', '池泉回遊式', '淨土庭園', '露地'],
    explain: '枯山水用石頭和砂表現山與水，不用真的水。多半坐在建築裡看，不走進去。' },
  { id: 'l8-2', facet: 'l8', level: 2, type: 'choice',
    prompt: '金澤兼六園、岡山後樂園這種繞著池子走一圈、景色不斷變換的大庭園，大多是誰建的？',
    options: ['江戶時代的大名', '平安時代的貴族', '室町時代的禪僧', '明治時代的商人'],
    explain: '池泉回遊式的大庭園多是江戶時代大名在自己藩裡建的，用來招待客人、展示財力和品味。' },

  { id: 'l9-1', facet: 'l9', level: 2, type: 'choice',
    prompt: '明治初年，日本木匠沒學過西洋建築，看了洋館後憑印象蓋出「像洋館」的房子，例如松本的舊開智學校。這類建築叫什麼？',
    options: ['擬洋風建築', '書院造', '數寄屋造', '帝冠樣式'],
    explain: '擬洋風：日本木匠用自己的木造技術模仿西洋外觀，常混著和風的屋頂、雕刻。舊開智學校 2019 年成為國寶。' },
  { id: 'l9-2', facet: 'l9', level: 3, type: 'choice',
    prompt: '東京車站丸之內站房（紅磚、白色條紋）是誰設計的？',
    options: ['辰野金吾', '喬賽亞．康德', '丹下健三', '立石清重'],
    explain: '辰野金吾是康德（Josiah Conder）在東京教出的第一批日本建築師，東京車站 1914 年完工，日本銀行本店也是他設計的。' },
];

Quiz.mount(document.getElementById('quiz'), {
  title: '建築程度診斷',
  facets, questions,
  storageKey: 'arch-diagnostic-v1',
  resultsEl: document.getElementById('results'),
  progressEl: document.getElementById('progress'),
  submitBtn: document.getElementById('submit'),
});
</script>
</body>
</html>
